services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:9001:8000"
    env_file: .env
    restart: always
    depends_on:
      db:
        condition: service_healthy
      searxng:
        condition: service_started
    # --proxy-headers: Caddy terminates TLS, so without X-Forwarded-Proto uvicorn
    # builds redirects as http:// — which downgraded POST /mcp -> /mcp/ for agents.
    command: uv run uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --workers 1 --proxy-headers --forwarded-allow-ips='*'

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: smartipedia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: smartipedia
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - smartipedia_pgdata:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartipedia"]
      interval: 10s
      timeout: 5s
      retries: 5

  searxng:
    image: searxng/searxng:latest
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./searxng:/etc/searxng
    environment:
      - SEARXNG_BASE_URL=https://smartipedia.com/searxng/
    deploy:
      resources:
        limits:
          memory: 256M
    restart: always

  # Umami reuses the existing Postgres (own role + database) instead of running
  # a second one — this droplet has 2GB of RAM and five containers already.
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD}@db:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: ${UMAMI_SECRET}
      DISABLE_TELEMETRY: "1"
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 384M
    restart: always

volumes:
  smartipedia_pgdata:
